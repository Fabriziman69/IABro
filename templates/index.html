<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis OS Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="stats-box" id="statsBox">
        <div class="stat-item">
            <span class="stat-label">API Calls:</span>
            <span class="stat-value" id="apiCallsValue">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Tokens (Sesión):</span>
            <span class="stat-value" id="tokensValue">0</span>
        </div>
    </div>
    
    <div class="container">
        <header>
            <h1>J.A.R.V.I.S.</h1>
            <p>SISTEMA OPERATIVO ACTIVO</p>
        </header>

        <div class="voice-container">
            <div class="pulse-ring hidden" id="pulseRing"></div>
            <button id="micBtn" class="mic-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
            <p id="statusText">Presiona para hablar</p>
        </div>

        <div class="chat-container">
            <div id="chatBox" class="chat-box">
                <div class="message system">
                    <span class="sender">Jarvis:</span> Hola bro, sistemas online. ¿En qué puedo ayudarte?
                </div>
            </div>
            
            <div class="input-area">
                <input type="text" id="textInput" placeholder="O escribe un comando aquí..." autocomplete="off">
                <button id="sendBtn">Enviar</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
